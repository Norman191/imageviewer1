name: Build Windows App

# Manual trigger (Actions tab -> Build Windows App -> Run workflow)
# plus automatic builds whenever main is updated.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable (installer + portable, no publishing)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ""

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-video-maker-windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
